<!DOCTYPE html>
<html>
<head>
    <title>Simple 3D Maze Game – Level 1</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r134/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/vexflow@4.2.2/build/cjs/vexflow.js"></script>
    <style>
        body { margin: 0; overflow: hidden; background: #000; }
        canvas { display: block; }
        #startScreen {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85); display: flex; flex-direction: column;
            justify-content: center; align-items: center; z-index: 10;
            color: #fff; font-family: Arial, sans-serif;
        }
        #startButton {
            padding: 18px 36px; font-size: 22px; cursor: pointer;
            background: #800080; color: #fff; border: none; border-radius: 6px; margin-bottom: 20px;
        }
        #startButton:hover { background: #9b30a0; }
        #startInstructions { font-size: 16px; text-align: center; line-height: 1.6; color: #ccc; }
        #crosshair {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%);
            width: 20px; height: 20px; pointer-events: none; z-index: 5; display: none;
        }
        #crosshair::before, #crosshair::after {
            content: ''; position: absolute; background: rgba(255,255,255,0.85);
        }
        #crosshair::before { left: 9px; top: 0; width: 2px; height: 20px; }
        #crosshair::after  { left: 0; top: 9px; width: 20px; height: 2px; }
        #minimapCanvas {
            position: absolute; bottom: 20px; left: 20px; width: 160px; height: 160px;
            background: rgba(0,0,0,0.75); border: 2px solid #e6d8ad; border-radius: 6px;
            z-index: 6; display: none;
        }
        #fadeOverlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: #000; opacity: 0; pointer-events: none; z-index: 30;
        }
        #levelCompleteText {
            position: absolute; top: 18%; left: 50%; transform: translate(-50%,-50%);
            color: #ffd700; font-size: 48px; font-family: Arial, sans-serif; font-weight: bold;
            text-shadow: 0 0 20px #000; display: none; z-index: 35; text-align: center;
            pointer-events: none;
        }
        #hud { position:absolute; top:0; left:0; padding:14px; padding-top:calc(14px + env(safe-area-inset-top,0px)); z-index:8; display:none; font-family:Arial,sans-serif; }
        #lifewrap { width:240px; height:22px; background:#222; border-radius:11px; overflow:hidden; border:1px solid #444; }
        #lifebar { height:100%; width:100%; background:#8fef8f; transition:width .3s,background .3s; }
        #lifelabel { font-size:.8rem; margin-top:4px; color:#ccc; }
        /* Boss life bar */
        #bosswrap { width:240px; height:22px; background:#222; border-radius:11px; overflow:hidden; border:1px solid #662222; margin-top:10px; display:none; }
        #bossbar { height:100%; width:100%; background:#e03333; transition:width .35s; }
        #bosslabel { font-size:.8rem; margin-top:4px; color:#e88; display:none; }
        #bosswrap.jiggle { animation: jiggle .45s ease; }
        @keyframes jiggle {
            0%,100% { transform: translateX(0); }
            20% { transform: translateX(-6px); }
            40% { transform: translateX(6px); }
            60% { transform: translateX(-4px); }
            80% { transform: translateX(4px); }
        }
        #flash { position:absolute; top:0; left:0; width:100%; height:100%; pointer-events:none; z-index:7; opacity:0; transition:opacity .12s; }
        #notegame { position:absolute; inset:0; z-index:25; display:none; flex-direction:column; align-items:center; justify-content:flex-end; background:rgba(0,0,0,.4); font-family:Arial,sans-serif; }
        #timerwrap { position:absolute; top:24px; right:24px; }
        #staffbox { background:rgba(15,12,10,.85); border-radius:14px; padding:14px; margin-bottom:8px; }
        #pianowrap { background:rgba(15,12,10,.85); border-radius:14px 14px 0 0; padding:10px 10px 20px; overflow-x:auto; }
        #piano { position:relative; height:130px; }
        .pkey { position:absolute; top:0; border-radius:0 0 4px 4px; cursor:pointer; }
        .pkey.w { background:linear-gradient(180deg,#fdf9ee,#e8e0cc); border:1px solid #998; z-index:1; height:130px; }
        .pkey.b { background:linear-gradient(180deg,#222,#000); border:1px solid #000; z-index:2; height:82px; }
        .pkey:active { filter:brightness(.85); }
        #gameOverScreen {
            position:absolute; inset:0; z-index:40; display:none; flex-direction:column;
            align-items:center; justify-content:center; background:rgba(0,0,0,.9); color:#fff; font-family:Arial,sans-serif;
        }
        #gameOverScreen h1 { font-size:2.4rem; margin-bottom:20px; }
        #returnHomeButton { padding:14px 32px; font-size:20px; cursor:pointer; background:#800080; color:#fff; border:none; border-radius:6px; }
        #returnHomeButton:hover { background:#9b30a0; }
    </style>
</head>
<body>
    <div id="startScreen">
        <button id="startButton">Start Game</button>
        <div id="startInstructions">
            Click to lock cursor<br>
            Press Esc to unlock cursor<br>
            WASD / Arrow keys to move<br>
            Look at the red door and click to open it<br>
            Avoid the angry red spheres!<br>
            Minimap is in the lower-left corner
        </div>
    </div>

    <div id="hud">
        <div id="lifewrap"><div id="lifebar"></div></div>
        <div id="lifelabel">Life 100/100</div>
        <div id="bosswrap"><div id="bossbar"></div></div>
        <div id="bosslabel">Boss 4/4</div>
    </div>
    <div id="crosshair"></div>
    <canvas id="minimapCanvas" width="160" height="160"></canvas>
    <div id="flash"></div>
    <div id="fadeOverlay"></div>
    <div id="levelCompleteText">You Beat The Game!</div>

    <div id="notegame">
      <svg id="timerwrap" width="70" height="70"><circle cx="35" cy="35" r="30" stroke="#333" stroke-width="6" fill="none"/><circle id="timerring" cx="35" cy="35" r="30" stroke="#3fa9dc" stroke-width="6" fill="none" stroke-dasharray="188" stroke-dashoffset="0" transform="rotate(-90 35 35)"/></svg>
      <div id="staffbox"><div id="staffsvg"></div></div>
      <div id="pianowrap"><div id="piano"></div></div>
    </div>

    <div id="gameOverScreen"><h1>Game Over</h1><button id="returnHomeButton">Return Home</button></div>

    <script>
        const scene = new THREE.Scene();
        scene.fog = new THREE.Fog(0xc8d0e0, 18, 40);

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        document.body.appendChild(renderer.domElement);

        const mazeWidth = 6;
        const mazeHeight = 6;
        const cellSize = 2.4;
        const wallHeight = 2.2;
        const wallThickness = 0.12;

        const player = { x: 2.4, z: 2.4, speed: 0.12, radius: 0.28 };
        camera.position.set(player.x, 1.1, player.z);
        camera.rotation.order = 'YXZ';

        let yaw = 0, pitch = 0;
        const mouseSensitivity = 0.002;

        let maze = [];
        let walls = [];

        // Red door
        let door = null;
        let doorMaterial = null;
        let doorPanelMaterials = [];
        let doorOpen = false;
        let doorOpening = false;
        let doorOpenStartTime = 0;
        let isHoveringDoor = false;
        const doorNormalColor = 0xcc0000;
        const doorHoverColor  = 0xff3333;
        const doorWidth = 1.0;

        // Boss
        let boss = null;
        let bossSpawned = false;
        let levelComplete = false;
        const BOSS_MAX_LIFE = 4;
        let bossLife = BOSS_MAX_LIFE;

        // 160° field of view (half-angle 80°)
        const FOV_DOT = Math.cos(80 * Math.PI / 180); // ≈ 0.1736

        const wallColor = 0x800080;
        const floorColor = 0x0000ff;
        const ceilingColor = 0xadd8e6;

        let enemies = [];
        const ENEMY_RADIUS = 0.25;
        const ENEMY_SLOW_SPEED = 0.022;
        const ENEMY_FAST_SPEED = 0.038;
        const BOSS_LOOK_SPEED = 0.025;
        let gameFrozen = false;
        let touchingEnemy = null;
        let floorMatRef = null, ceilMatRef = null;

        // -------------------- Audio --------------------
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

        function tone(freq, dur, type) {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = type || 'sine';
            osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
            gain.gain.setValueAtTime(0.22, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + dur);
            osc.connect(gain); gain.connect(audioCtx.destination);
            osc.start(); osc.stop(audioCtx.currentTime + dur);
        }
        function sfxWrong() {
            const o = audioCtx.createOscillator(), g = audioCtx.createGain();
            o.type = 'sawtooth';
            o.frequency.setValueAtTime(500, audioCtx.currentTime);
            o.frequency.exponentialRampToValueAtTime(120, audioCtx.currentTime + 0.6);
            g.gain.setValueAtTime(0.18, audioCtx.currentTime);
            g.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.6);
            o.connect(g); g.connect(audioCtx.destination);
            o.start(); o.stop(audioCtx.currentTime + 0.6);
        }
        function sfxWin() {
            [523.25, 659.25, 783.99, 1046.5].forEach((f, i) => setTimeout(() => tone(f, 0.35, 'triangle'), i * 90));
        }

        function playRedDoorBeep() {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'sine';
            osc.frequency.value = 880;
            gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.12);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.12);
        }

        function playRedDoorVanish() {
            const notes = [523.25, 659.25, 783.99, 830.61];
            notes.forEach((freq, i) => {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'sine';
                osc.frequency.value = freq;
                const start = audioCtx.currentTime + i * 0.11;
                gain.gain.setValueAtTime(0.18, start);
                gain.gain.exponentialRampToValueAtTime(0.001, start + 0.14);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start(start);
                osc.stop(start + 0.14);
            });
        }

        let chaseMusicPlaying = false;
        let chaseMusicTimer = null;
        function playChaseMusicLoop() {
            if (!chaseMusicPlaying) return;
            const notes = [523.25, 554.37, 587.33, 622.25, 659.25, 659.25, 659.25];
            notes.forEach((freq, i) => {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'square';
                osc.frequency.value = freq;
                const start = audioCtx.currentTime + i * 0.08;
                gain.gain.setValueAtTime(0.09, start);
                gain.gain.exponentialRampToValueAtTime(0.001, start + 0.07);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start(start);
                osc.stop(start + 0.07);
            });
            chaseMusicTimer = setTimeout(playChaseMusicLoop, notes.length * 80 + 30);
        }
        function startChaseMusic() {
            if (chaseMusicPlaying) return;
            chaseMusicPlaying = true;
            themeAudio.pause();
            playChaseMusicLoop();
        }
        function stopChaseMusic() {
            chaseMusicPlaying = false;
            if (chaseMusicTimer) { clearTimeout(chaseMusicTimer); chaseMusicTimer = null; }

            if (noteGame.active || life <= 0) return;
            if (bossSpawned && boss && !boss.dying) return;
            if (!bossAudio.paused) return;

            if (themeAudio.paused) {
                themeAudio.volume = 0;
                themeAudio.play().catch(() => {});
                fadeInTheme();
            }
        }

        function playTouchChord() {
            [523.25, 739.99, 987.77].forEach(freq => {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'sawtooth';
                osc.frequency.value = freq;
                gain.gain.setValueAtTime(0.12, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.5);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.5);
            });
        }

        function playExplosionNoise() {
            const duration = 0.35;
            const sampleRate = audioCtx.sampleRate;
            const buffer = audioCtx.createBuffer(1, sampleRate * duration, sampleRate);
            const data = buffer.getChannelData(0);
            for (let i = 0; i < data.length; i++) data[i] = (Math.random()*2-1) * Math.pow(1 - i/data.length, 1.5);
            const src = audioCtx.createBufferSource();
            const gain = audioCtx.createGain();
            src.buffer = buffer;
            gain.gain.setValueAtTime(0.4, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
            src.connect(gain);
            gain.connect(audioCtx.destination);
            src.start();
        }

        // -------------------- Background music --------------------
        const themeAudio = new Audio('Theme Music.mp3');
        themeAudio.volume = 0.5;
        const bossAudio = new Audio('Boss Music.mp3');
        bossAudio.volume = 0.5;
        const fanfareAudio = new Audio('Fanfare.mp3');
        fanfareAudio.volume = 0.7;

        function enableSeamlessLoop(audio) {
            audio.addEventListener('timeupdate', () => {
                if (audio.duration && !audio.paused && audio.currentTime > audio.duration - 0.12) {
                    audio.currentTime = 0.02;
                }
            });
            audio.addEventListener('ended', () => {
                audio.currentTime = 0.02;
                audio.play().catch(() => {});
            });
        }
        enableSeamlessLoop(themeAudio);
        enableSeamlessLoop(bossAudio);

        function fadeAudio(el, to, ms) {
            const from = el.volume, start = performance.now();
            function step(t) {
                const p = Math.min(1, (t - start) / ms);
                el.volume = from + (to - from) * p;
                if (p < 1) requestAnimationFrame(step);
            }
            requestAnimationFrame(step);
        }
        function duckTheme() { themeAudio.volume = 0; }
        function fadeInTheme() {
            if (themeAudio.paused) themeAudio.play().catch(() => {});
            fadeAudio(themeAudio, 0.5, 1000);
        }

        // -------------------- Life bars --------------------
        let life = 100;
        function setLife(v) {
            life = Math.max(0, Math.min(100, v));
            document.getElementById('lifebar').style.width = life + '%';
            document.getElementById('lifebar').style.background = 'hsl(' + Math.round(life*1.2) + ',75%,55%)';
            document.getElementById('lifelabel').textContent = 'Life ' + life + '/100';
            if (life <= 0) doGameOver();
        }
        function setBossLife(v) {
            bossLife = Math.max(0, Math.min(BOSS_MAX_LIFE, v));
            const pct = (bossLife / BOSS_MAX_LIFE) * 100;
            document.getElementById('bossbar').style.width = pct + '%';
            document.getElementById('bosslabel').textContent = 'Boss ' + bossLife + '/' + BOSS_MAX_LIFE;
        }
        function showBossLifeBar() {
            document.getElementById('bosswrap').style.display = 'block';
            document.getElementById('bosslabel').style.display = 'block';
            setBossLife(BOSS_MAX_LIFE);
        }
        function hideBossLifeBar() {
            document.getElementById('bosswrap').style.display = 'none';
            document.getElementById('bosslabel').style.display = 'none';
        }
        function jiggleBossBar() {
            const el = document.getElementById('bosswrap');
            el.classList.remove('jiggle');
            void el.offsetWidth; // restart animation
            el.classList.add('jiggle');
            setTimeout(() => el.classList.remove('jiggle'), 500);
        }
        function flash(kind) {
            const f = document.getElementById('flash');
            f.style.background = kind === 'good' ? 'rgba(63,220,106,.35)' : 'rgba(224,69,60,.4)';
            f.style.opacity = 1;
            setTimeout(() => { f.style.opacity = 0; }, 480);
        }
        function doGameOver() {
            gameFrozen = true;
            noteGame.active = false;
            clearCountdown();
            document.getElementById('notegame').style.display = 'none';
            document.exitPointerLock();
            document.getElementById('crosshair').style.display = 'none';
            document.getElementById('gameOverScreen').style.display = 'flex';
            themeAudio.pause(); bossAudio.pause();
        }
        document.getElementById('returnHomeButton').addEventListener('click', () => location.reload());

        // -------------------- Note-reading mini-game --------------------
        const VF = Vex.Flow;
        const FREQ = {C4:261.63,'C#4':277.18,D4:293.66,'D#4':311.13,E4:329.63,F4:349.23,'F#4':369.99,G4:392,'G#4':415.3,A4:440,'A#4':466.16,B4:493.88,C5:523.25,'C#5':554.37,D5:587.33,'D#5':622.25,E5:659.25,F5:698.46,'F#5':739.99,G5:783.99};
        const POOL = ['F4','A4','C5','E5'];
        const noteGame = { active:false, type:null, ref:null, seq:[], countdownEnd:0 };
        let timerRAF = null;

        function genSeq(n) {
            if (n <= 4) {
                const p = POOL.slice();
                for (let i = p.length-1; i > 0; i--) { const r = Math.floor(Math.random()*(i+1)); [p[i],p[r]] = [p[r],p[i]]; }
                return p.slice(0, n);
            }
            const out = []; let last = null;
            for (let k = 0; k < n; k++) { let c; do { c = POOL[Math.floor(Math.random()*POOL.length)]; } while (c === last); out.push(c); last = c; }
            return out;
        }
        function renderStaff() {
            const el = document.getElementById('staffsvg'); el.innerHTML = '';
            const r = new VF.Renderer(el, VF.Renderer.Backends.SVG);
            const w = Math.max(260, 80 + noteGame.seq.length*60);
            r.resize(w, 150);
            const ctx = r.getContext(); ctx.setFillStyle('#e8e0cc'); ctx.setStrokeStyle('#e8e0cc');
            const stave = new VF.Stave(10, 30, w-20); stave.addClef('treble'); stave.setContext(ctx).draw();
            if (noteGame.seq.length) {
                const notes = noteGame.seq.map(n => {
                    const m = n.match(/^([A-G]#?)(\d)$/);
                    const sn = new VF.StaveNote({ clef:'treble', keys:[m[1].toLowerCase()+'/'+m[2]], duration:'q' });
                    sn.setStyle({ fillStyle:'#3fa9dc', strokeStyle:'#3fa9dc' });
                    return sn;
                });
                VF.Formatter.FormatAndDraw(ctx, stave, notes);
            }
        }
        const PKEYS = [['C','w'],['C#','b'],['D','w'],['D#','b'],['E','w'],['F','w'],['F#','b'],['G','w'],['G#','b'],['A','w'],['A#','b'],['B','w'],['C','w'],['C#','b'],['D','w'],['D#','b'],['E','w'],['F','w'],['F#','b'],['G','w']];
        function buildPiano() {
            const wrap = document.getElementById('piano'); wrap.innerHTML = '';
            const WW=32, WS=34, BW=18, BH=78; let wx=0, lastW=0, oct=4, prevLetter=null;
            PKEYS.forEach(k => {
                const letter=k[0], type=k[1]; if (letter==='C' && prevLetter==='B') oct=5;
                const name = letter+oct;
                const el = document.createElement('div'); el.className = 'pkey '+type;
                if (type==='w') { el.style.left=wx+'px'; el.style.width=WW+'px'; lastW=wx; wx+=WS; }
                else { el.style.left=(lastW+22)+'px'; el.style.width=BW+'px'; el.style.height=BH+'px'; }
                el.addEventListener('click', ev => { ev.stopPropagation(); tone(FREQ[name]||440, 0.25, 'sine'); handleNotePlayed(name); });
                wrap.appendChild(el);
                prevLetter = letter;
            });
            wrap.style.width = wx+'px';
        }
        buildPiano();

        function startNoteGame(type, ref) {
            if (document.pointerLockElement) document.exitPointerLock();
            document.getElementById('crosshair').style.display = 'none';
            gameFrozen = true;
            noteGame.active = true;
            noteGame.type = type;
            noteGame.ref = ref || null;
            stopChaseMusic();
            // First note game (red door) keeps Theme Music playing
            if (type !== 'door1') {
                themeAudio.pause();
            }
            noteGame.seq = genSeq(type==='boss' ? 8 : 4);
            document.getElementById('notegame').style.display = 'flex';
            document.getElementById('timerwrap').style.visibility = (type==='door1') ? 'hidden' : 'visible';
            renderStaff();
            if (type !== 'door1') startCountdown(type==='boss' ? 18 : 12); else clearCountdown();
        }
        function startCountdown(sec) {
            clearCountdown();
            noteGame.countdownEnd = performance.now() + sec*1000;
            const ring = document.getElementById('timerring'), C_ = 188;
            function step() {
                const left = noteGame.countdownEnd - performance.now();
                const frac = Math.max(0, left/(sec*1000));
                ring.setAttribute('stroke-dashoffset', C_*(1-frac));
                if (left <= 0) { onTimeout(); return; }
                timerRAF = requestAnimationFrame(step);
            }
            step();
        }
        function clearCountdown() { if (timerRAF) cancelAnimationFrame(timerRAF); timerRAF = null; }
        function onTimeout() {
            if (noteGame.type === 'door1') return;
            if (life - 20 < 0) { setLife(0); return; }
            setLife(life - 20); sfxWrong(); flash('bad');
            noteGame.seq = genSeq(noteGame.type==='boss' ? 8 : 4); renderStaff();
            startCountdown(noteGame.type==='boss' ? 18 : 12);
        }
        function handleNotePlayed(name) {
            if (!noteGame.active) return;
            const expect = noteGame.seq[0];
            if (name === expect) {
                noteGame.seq.shift(); flash('good'); renderStaff();
                if (!noteGame.seq.length) endNoteGame(true);
            } else {
                flash('bad'); sfxWrong();
                if (noteGame.type !== 'door1') {
                    if (life - 10 <= 0) { setLife(0); return; }
                    setLife(life - 10);
                    startCountdown(noteGame.type==='boss' ? 18 : 12);
                }
                noteGame.seq = genSeq(noteGame.type==='boss' ? 8 : 4); renderStaff();
            }
        }
        function endNoteGame(success) {
            clearCountdown(); noteGame.active = false;
            document.getElementById('notegame').style.display = 'none';
            if (!success) return;
            sfxWin();
            if (noteGame.type === 'door1') {
                playRedDoorVanish();
                doorOpening = true; doorOpenStartTime = performance.now();
                gameFrozen = false;
                document.getElementById('crosshair').style.display = 'block';
                document.body.requestPointerLock();
                // Theme was never stopped for door1
            } else if (noteGame.type === 'enemy') {
                setLife(Math.min(100, life + 20));
                playExplosionNoise();
                const e = noteGame.ref; e.dying = true; e.dieStart = performance.now(); e.diePhase = 0;
            } else if (noteGame.type === 'boss') {
                // Damage boss by 1/4
                setBossLife(bossLife - 1);
                jiggleBossBar();
                playExplosionNoise();
                const b = noteGame.ref;
                if (bossLife <= 0) {
                    // Final hit – boss dies
                    b.dying = true; b.dieStart = performance.now(); b.diePhase = 0;
                } else {
                    // Freeze boss for 3 seconds; player can run away
                    b.frozenUntil = performance.now() + 3000;
                    b.isChasing = false;
                    gameFrozen = false;
                    touchingEnemy = null;
                    document.getElementById('crosshair').style.display = 'block';
                    document.body.requestPointerLock();
                }
            }
        }

        // -------------------- Maze generation --------------------
        function generateMaze() {
            maze = [];
            for (let x = 0; x < mazeWidth; x++) {
                maze[x] = [];
                for (let z = 0; z < mazeHeight; z++) {
                    maze[x][z] = { visited: false, walls: [true, true, true, true] };
                }
            }

            maze[0][0].walls[1] = false; maze[1][0].walls[3] = false;
            maze[0][0].walls[2] = false; maze[0][1].walls[0] = false;
            maze[1][0].walls[2] = false; maze[1][1].walls[0] = false;
            maze[0][1].walls[1] = false; maze[1][1].walls[3] = false;

            maze[0][0].visited = true;
            maze[1][0].visited = true;
            maze[0][1].visited = true;
            maze[1][1].visited = true;

            maze[1][1].walls[1] = false;
            maze[2][1].walls[3] = false;
            maze[2][1].visited = true;

            const stack = [];
            let current = { x: 2, z: 1 };
            while (true) {
                const neighbors = [];
                const { x, z } = current;
                if (z > 0 && !maze[x][z-1].visited) neighbors.push({x, z:z-1, wall:0, neighborWall:2});
                if (x < mazeWidth-1 && !maze[x+1][z].visited) neighbors.push({x:x+1, z, wall:1, neighborWall:3});
                if (z < mazeHeight-1 && !maze[x][z+1].visited) neighbors.push({x, z:z+1, wall:2, neighborWall:0});
                if (x > 0 && !maze[x-1][z].visited) neighbors.push({x:x-1, z, wall:3, neighborWall:1});
                if (neighbors.length > 0) {
                    const next = neighbors[Math.floor(Math.random()*neighbors.length)];
                    maze[current.x][current.z].walls[next.wall] = false;
                    maze[next.x][next.z].walls[next.neighborWall] = false;
                    maze[next.x][next.z].visited = true;
                    stack.push(current);
                    current = {x: next.x, z: next.z};
                } else if (stack.length > 0) current = stack.pop();
                else break;
            }

            for (let i = 0; i < 12; i++) {
                const x = Math.floor(Math.random() * mazeWidth);
                const z = Math.floor(Math.random() * mazeHeight);
                if (x < 2 && z < 2) continue;
                const dir = Math.floor(Math.random() * 4);
                if (dir === 0 && z > 0 && !(x < 2 && z-1 < 2)) {
                    maze[x][z].walls[0] = false; maze[x][z-1].walls[2] = false;
                } else if (dir === 1 && x < mazeWidth-1 && !(x+1 < 2 && z < 2)) {
                    maze[x][z].walls[1] = false; maze[x+1][z].walls[3] = false;
                } else if (dir === 2 && z < mazeHeight-1 && !(x < 2 && z+1 < 2)) {
                    maze[x][z].walls[2] = false; maze[x][z+1].walls[0] = false;
                } else if (dir === 3 && x > 0 && !(x-1 < 2 && z < 2)) {
                    maze[x][z].walls[3] = false; maze[x-1][z].walls[1] = false;
                }
            }
        }

        function addDoorPanels(parentGroup, width, height, thickness) {
            const panelMat = new THREE.MeshStandardMaterial({
                color: 0x550000, roughness: 0.6, transparent: true, opacity: 1
            });
            doorPanelMaterials.push(panelMat);

            const pw = width * 0.38;
            const ph = height * 0.38;
            const offsets = [
                { y:  height*0.22, z: -width*0.22 },
                { y:  height*0.22, z:  width*0.22 },
                { y: -height*0.22, z: -width*0.22 },
                { y: -height*0.22, z:  width*0.22 }
            ];
            offsets.forEach(o => {
                const panel = new THREE.Mesh(
                    new THREE.BoxGeometry(thickness * 0.55, ph, pw),
                    panelMat
                );
                panel.position.set(-thickness * 0.55, o.y, o.z);
                parentGroup.add(panel);
            });
        }

        // -------------------- Create maze --------------------
        function createMaze() {
            while (scene.children.length) scene.remove(scene.children[0]);
            walls = [];
            door = null; doorOpen = false; doorOpening = false; isHoveringDoor = false;
            doorPanelMaterials = [];
            boss = null; bossSpawned = false; bossLife = BOSS_MAX_LIFE;
            enemies = []; gameFrozen = false; touchingEnemy = null;
            levelComplete = false;
            hideBossLifeBar();
            document.getElementById('levelCompleteText').style.display = 'none';

            const wallMat = new THREE.MeshStandardMaterial({ color: wallColor, roughness: 0.7 });
            const floorMat = new THREE.MeshStandardMaterial({ color: floorColor, roughness: 0.9 });
            const ceilMat  = new THREE.MeshStandardMaterial({ color: ceilingColor, roughness: 0.8 });
            floorMatRef = floorMat; ceilMatRef = ceilMat;

            const floorGeo = new THREE.PlaneGeometry(mazeWidth*cellSize, mazeHeight*cellSize);
            const floor = new THREE.Mesh(floorGeo, floorMat);
            floor.rotation.x = -Math.PI/2;
            floor.position.set(mazeWidth*cellSize/2, 0, mazeHeight*cellSize/2);
            floor.receiveShadow = true;
            scene.add(floor);

            const ceiling = new THREE.Mesh(floorGeo, ceilMat);
            ceiling.rotation.x = Math.PI/2;
            ceiling.position.set(mazeWidth*cellSize/2, wallHeight, mazeHeight*cellSize/2);
            scene.add(ceiling);

            for (let x = 0; x < mazeWidth; x++) {
                for (let z = 0; z < mazeHeight; z++) {
                    const cell = maze[x][z];
                    if (cell.walls[0]) {
                        const w = new THREE.Mesh(new THREE.BoxGeometry(cellSize, wallHeight, wallThickness), wallMat);
                        w.position.set(x*cellSize + cellSize/2, wallHeight/2, z*cellSize);
                        w.userData.isOuter = (z === 0);
                        w.castShadow = w.receiveShadow = true; scene.add(w); walls.push(w);
                    }
                    if (cell.walls[1]) {
                        const w = new THREE.Mesh(new THREE.BoxGeometry(wallThickness, wallHeight, cellSize), wallMat);
                        w.position.set(x*cellSize + cellSize, wallHeight/2, z*cellSize + cellSize/2);
                        w.userData.isOuter = (x === mazeWidth - 1);
                        w.castShadow = w.receiveShadow = true; scene.add(w); walls.push(w);
                    }
                    if (cell.walls[2]) {
                        const w = new THREE.Mesh(new THREE.BoxGeometry(cellSize, wallHeight, wallThickness), wallMat);
                        w.position.set(x*cellSize + cellSize/2, wallHeight/2, (z+1)*cellSize);
                        w.userData.isOuter = (z === mazeHeight - 1);
                        w.castShadow = w.receiveShadow = true; scene.add(w); walls.push(w);
                    }
                    if (cell.walls[3]) {
                        const w = new THREE.Mesh(new THREE.BoxGeometry(wallThickness, wallHeight, cellSize), wallMat);
                        w.position.set(x*cellSize, wallHeight/2, z*cellSize + cellSize/2);
                        w.userData.isOuter = (x === 0);
                        w.castShadow = w.receiveShadow = true; scene.add(w); walls.push(w);
                    }
                }
            }

            door = new THREE.Group();
            doorMaterial = new THREE.MeshStandardMaterial({
                color: doorNormalColor, roughness: 0.55, transparent: true, opacity: 1
            });
            const doorMain = new THREE.Mesh(
                new THREE.BoxGeometry(wallThickness, wallHeight, doorWidth),
                doorMaterial
            );
            door.add(doorMain);
            addDoorPanels(door, doorWidth, wallHeight, wallThickness);
            door.position.set(2 * cellSize, wallHeight/2, 1 * cellSize + cellSize/2);
            scene.add(door);

            const sideW = (cellSize - doorWidth) / 2;
            const sideGeo = new THREE.BoxGeometry(wallThickness, wallHeight, sideW);
            const s1 = new THREE.Mesh(sideGeo, wallMat);
            s1.position.set(2*cellSize, wallHeight/2, 1*cellSize + cellSize/2 - doorWidth/2 - sideW/2);
            s1.userData.isOuter = false;
            scene.add(s1); walls.push(s1);
            const s2 = new THREE.Mesh(sideGeo, wallMat);
            s2.position.set(2*cellSize, wallHeight/2, 1*cellSize + cellSize/2 + doorWidth/2 + sideW/2);
            s2.userData.isOuter = false;
            scene.add(s2); walls.push(s2);

            scene.add(new THREE.AmbientLight(0xffffff, 0.6));
            for (let x = 0; x < mazeWidth; x += 1.5) {
                for (let z = 0; z < mazeHeight; z += 1.5) {
                    const l = new THREE.PointLight(0xfff8e7, 0.9, 14, 1.1);
                    l.position.set(x*cellSize + cellSize/2, wallHeight-0.2, z*cellSize + cellSize/2);
                    scene.add(l);
                }
            }
            scene.add(new THREE.HemisphereLight(0xffffff, 0xb0c4de, 0.45));
        }

        // -------------------- Enemies & Boss --------------------
        function createEnemy(x, z, isBoss = false) {
            const group = new THREE.Group();
            const radius = isBoss ? 0.8 : ENEMY_RADIUS;
            const mat = new THREE.MeshStandardMaterial({
                color: 0xff2200, emissive: 0xff2200, emissiveIntensity: 0.75, metalness: 0.3
            });
            const sphere = new THREE.Mesh(new THREE.SphereGeometry(radius, 20, 16), mat);
            group.add(sphere);

            const faceGroup = new THREE.Group();
            const black = new THREE.MeshBasicMaterial({ color: 0x000000 });
            const sc = isBoss ? 3.0 : 1;
            const armGeo = new THREE.BoxGeometry(0.04*sc, 0.18*sc, 0.02*sc);
            const leftArm = new THREE.Mesh(armGeo, black);
            leftArm.position.set(-0.07*sc, 0.11*sc, radius-0.02);
            leftArm.rotation.z = 0.5;
            faceGroup.add(leftArm);
            const rightArm = new THREE.Mesh(armGeo, black);
            rightArm.position.set(0.07*sc, 0.11*sc, radius-0.02);
            rightArm.rotation.z = -0.5;
            faceGroup.add(rightArm);
            const dotGeo = new THREE.SphereGeometry(0.035*sc, 8, 6);
            const ld = new THREE.Mesh(dotGeo, black);
            ld.position.set(-0.09*sc, -0.02*sc, radius-0.02);
            faceGroup.add(ld);
            const rd = new THREE.Mesh(dotGeo, black);
            rd.position.set(0.09*sc, -0.02*sc, radius-0.02);
            faceGroup.add(rd);
            group.add(faceGroup);

            const yPos = isBoss ? radius + 0.05 : 1.0;
            group.position.set(x, yPos, z);
            const angle = Math.random() * Math.PI * 2;
            group.rotation.y = angle;
            scene.add(group);

            return {
                group, sphere, sphereMat: mat, faceGroup,
                x, z, radius, facing: angle,
                isChasing: false, wanderTimer: 0, turning: false, turnDir: 1,
                dying: false, dieStart: 0, diePhase: 0, isBoss,
                lookDir: Math.random() < 0.5 ? 1 : -1,
                frozenUntil: 0
            };
        }

        function spawnEnemies() {
            const candidates = [];
            for (let x = 0; x < mazeWidth; x++) {
                for (let z = 0; z < mazeHeight; z++) {
                    if (x <= 1 && z <= 1) continue;
                    if (x === 2 && z === 1) continue;
                    candidates.push({x, z});
                }
            }
            for (let i = candidates.length-1; i > 0; i--) {
                const j = Math.floor(Math.random()*(i+1));
                [candidates[i], candidates[j]] = [candidates[j], candidates[i]];
            }
            for (let i = 0; i < 8 && i < candidates.length; i++) {
                const c = candidates[i];
                enemies.push(createEnemy(c.x*cellSize + cellSize/2, c.z*cellSize + cellSize/2, false));
            }
        }

        let bossRedLight = null;
        function enterBossPhase() {
            if (ceilMatRef) ceilMatRef.color.setHex(0x000000);
            if (floorMatRef) { floorMatRef.color.setHex(0xff0000); floorMatRef.emissive.setHex(0x550000); }
            bossRedLight = new THREE.AmbientLight(0xff2222, 0.6);
            scene.add(bossRedLight);
            themeAudio.pause();
            bossAudio.currentTime = 0; bossAudio.volume = 0.5; bossAudio.play().catch(()=>{});
        }
        function exitBossPhase() {
            if (ceilMatRef) ceilMatRef.color.setHex(ceilingColor);
            if (floorMatRef) { floorMatRef.color.setHex(floorColor); floorMatRef.emissive.setHex(0x000000); }
            if (bossRedLight) { scene.remove(bossRedLight); bossRedLight = null; }
            bossAudio.pause();
        }

        function clearInteriorWalls() {
            for (let i = walls.length - 1; i >= 0; i--) {
                const w = walls[i];
                if (!w.userData.isOuter) {
                    scene.remove(w);
                    walls.splice(i, 1);
                }
            }
            if (door) {
                scene.remove(door);
                door = null;
                doorOpen = true;
                doorOpening = false;
                isHoveringDoor = false;
            }
            for (let x = 0; x < mazeWidth; x++) {
                for (let z = 0; z < mazeHeight; z++) {
                    maze[x][z].walls = [false, false, false, false];
                }
            }
            for (let x = 0; x < mazeWidth; x++) {
                maze[x][0].walls[0] = true;
                maze[x][mazeHeight - 1].walls[2] = true;
            }
            for (let z = 0; z < mazeHeight; z++) {
                maze[0][z].walls[3] = true;
                maze[mazeWidth - 1][z].walls[1] = true;
            }
        }

        function spawnBossArena() {
            if (bossSpawned) return;
            bossSpawned = true;

            clearInteriorWalls();
            enterBossPhase();
            showBossLifeBar();

            const bossX = (mazeWidth * cellSize) / 2;
            const bossZ = (mazeHeight * cellSize) / 2;
            boss = createEnemy(bossX, bossZ, true);
            boss.isChasing = false;
            boss.facing = Math.random() * Math.PI * 2;
            boss.group.rotation.y = boss.facing;
            boss.lookDir = Math.random() < 0.5 ? 1 : -1;
            boss.frozenUntil = 0;
            bossLife = BOSS_MAX_LIFE;
            setBossLife(BOSS_MAX_LIFE);
        }

        // -------------------- Collision / vision --------------------
        function checkWallCollision(px, pz, radius) {
            const s = new THREE.Sphere(new THREE.Vector3(px, 1.0, pz), radius);
            for (const w of walls) {
                if (s.intersectsBox(new THREE.Box3().setFromObject(w))) return true;
            }
            if (!doorOpen && door) {
                if (s.intersectsBox(new THREE.Box3().setFromObject(door))) return true;
            }
            return false;
        }

        function checkPlayerEnemyCollision() {
            for (const e of enemies) {
                if (e.dying) continue;
                const dx = player.x - e.x, dz = player.z - e.z;
                if (Math.sqrt(dx*dx + dz*dz) < player.radius + e.radius) return e;
            }
            if (boss && !boss.dying) {
                // Don't re-trigger while frozen
                if (performance.now() < (boss.frozenUntil || 0)) return null;
                const dx = player.x - boss.x, dz = player.z - boss.z;
                if (Math.sqrt(dx*dx + dz*dz) < player.radius + boss.radius) return boss;
            }
            return null;
        }

        const raycaster = new THREE.Raycaster();

        function canSeeAhead(e, dist) {
            const origin = new THREE.Vector3(e.x, e.isBoss ? e.radius : 1.0, e.z);
            const dir = new THREE.Vector3(Math.sin(e.facing), 0, Math.cos(e.facing)).normalize();
            raycaster.set(origin, dir); raycaster.far = dist;
            const hits = raycaster.intersectObjects(walls);
            return hits.length === 0 || hits[0].distance >= dist - 0.05;
        }

        function isFacingCorner(e) {
            const short = cellSize * 0.35;
            if (canSeeAhead(e, short)) return false;
            const origin = new THREE.Vector3(e.x, e.isBoss ? e.radius : 1.0, e.z);
            function blocked(f) {
                const dir = new THREE.Vector3(Math.sin(f), 0, Math.cos(f)).normalize();
                raycaster.set(origin, dir); raycaster.far = short;
                const hits = raycaster.intersectObjects(walls);
                return hits.length > 0 && hits[0].distance < short;
            }
            return blocked(e.facing + 0.6) && blocked(e.facing - 0.6);
        }

        // 160° sector vision: player must be within ±80° of facing, and
        // the ray from enemy center to player must not hit a wall first.
        function canSeePlayer(e) {
            const dx = player.x - e.x, dz = player.z - e.z;
            const dist = Math.sqrt(dx*dx + dz*dz);
            if (dist > 30 || dist < 0.15) return false;
            const dirX = dx/dist, dirZ = dz/dist;
            const fx = Math.sin(e.facing), fz = Math.cos(e.facing);
            // Dot product ≥ cos(80°) ⇒ within 160° FOV
            if (fx*dirX + fz*dirZ < FOV_DOT) return false;
            const origin = new THREE.Vector3(e.x, e.isBoss ? e.radius : 1.0, e.z);
            const direction = new THREE.Vector3(dirX, 0, dirZ).normalize();
            raycaster.set(origin, direction); raycaster.far = dist;
            const hits = raycaster.intersectObjects(walls);
            if (hits.length > 0 && hits[0].distance < dist - 0.2) return false;
            return true;
        }

        function isDoorUnderCrosshair() {
            if (!door || doorOpen || doorOpening) return false;
            raycaster.far = Infinity;
            raycaster.setFromCamera(new THREE.Vector2(0,0), camera);
            return raycaster.intersectObject(door, true).length > 0;
        }

        function tryOpenDoor() {
            if (gameFrozen || noteGame.active) return;
            if (isDoorUnderCrosshair()) {
                startNoteGame('door1', null);
            }
        }

        // -------------------- Input --------------------
        const keys = {};
        document.addEventListener('keydown', e => keys[e.key.toLowerCase()] = true);
        document.addEventListener('keyup',   e => keys[e.key.toLowerCase()] = false);

        document.addEventListener('click', () => {
            if (document.pointerLockElement === document.body) {
                tryOpenDoor();
            } else if (!gameFrozen && !noteGame.active) {
                document.body.requestPointerLock();
            }
        });

        document.addEventListener('mousemove', e => {
            if (document.pointerLockElement === document.body && !gameFrozen) {
                yaw   -= e.movementX * mouseSensitivity;
                pitch -= e.movementY * mouseSensitivity;
                pitch = Math.max(-Math.PI/2+0.1, Math.min(Math.PI/2-0.1, pitch));
                camera.rotation.y = yaw;
                camera.rotation.x = pitch;
            }
        });

        // -------------------- AI --------------------
        function updateOneEnemy(e, dt) {
            if (e.dying) return false;

            // Boss frozen after a successful note-game hit
            if (e.isBoss && performance.now() < (e.frozenUntil || 0)) {
                e.isChasing = false;
                e.group.position.set(e.x, e.radius + 0.05, e.z);
                e.group.rotation.y = e.facing;
                return false;
            }

            // Boss: look around until it sees the player in its 160° FOV
            if (e.isBoss) {
                if (!e.isChasing) {
                    e.facing += e.lookDir * BOSS_LOOK_SPEED;
                    e.group.rotation.y = e.facing;
                    e.group.position.set(e.x, e.radius + 0.05, e.z);
                    if (canSeePlayer(e)) {
                        e.isChasing = true;
                    }
                    return false;
                }
                const speed = ENEMY_FAST_SPEED * 1.15;
                const dx = player.x - e.x, dz = player.z - e.z;
                const d = Math.sqrt(dx*dx + dz*dz) || 0.001;
                const moveX = (dx/d)*speed, moveZ = (dz/d)*speed;
                e.facing = Math.atan2(dx, dz);

                let newX = e.x + moveX, newZ = e.z + moveZ;
                if (!checkWallCollision(newX, e.z, e.radius)) e.x = newX;
                if (!checkWallCollision(e.x, newZ, e.radius)) e.z = newZ;

                e.x = Math.max(0.6, Math.min(mazeWidth*cellSize-0.6, e.x));
                e.z = Math.max(0.6, Math.min(mazeHeight*cellSize-0.6, e.z));
                e.group.position.set(e.x, e.radius + 0.05, e.z);
                e.group.rotation.y = e.facing;
                return true;
            }

            // Normal enemies – 160° vision
            e.isChasing = canSeePlayer(e);

            const tooClose = !canSeeAhead(e, cellSize * 0.2);
            const corner = isFacingCorner(e);

            if (e.turning || tooClose || corner) {
                if (!e.turning) {
                    e.turning = true;
                    e.turnDir = Math.random() < 0.5 ? 1 : -1;
                }
                e.facing += e.turnDir * 0.14;
                if (canSeeAhead(e, cellSize) && !isFacingCorner(e)) e.turning = false;
                e.group.rotation.y = e.facing;
                e.group.position.set(e.x, 1.0, e.z);
                return e.isChasing;
            }

            const speed = e.isChasing ? ENEMY_FAST_SPEED : ENEMY_SLOW_SPEED;
            let moveX = 0, moveZ = 0;
            if (e.isChasing) {
                const dx = player.x - e.x, dz = player.z - e.z;
                const d = Math.sqrt(dx*dx + dz*dz) || 0.001;
                moveX = (dx/d)*speed; moveZ = (dz/d)*speed;
                e.facing = Math.atan2(dx, dz);
            } else {
                e.wanderTimer -= dt;
                if (e.wanderTimer <= 0) {
                    e.facing += (Math.random()-0.5)*1.4;
                    e.wanderTimer = 2 + Math.random()*2.5;
                }
                moveX = Math.sin(e.facing)*speed;
                moveZ = Math.cos(e.facing)*speed;
            }

            let newX = e.x + moveX, newZ = e.z + moveZ;
            let hit = false;
            if (!checkWallCollision(newX, e.z, e.radius)) e.x = newX; else hit = true;
            if (!checkWallCollision(e.x, newZ, e.radius)) e.z = newZ; else hit = true;
            if (hit) { e.turning = true; e.turnDir = Math.random()<0.5 ? 1 : -1; }

            e.x = Math.max(0.6, Math.min(mazeWidth*cellSize-0.6, e.x));
            e.z = Math.max(0.6, Math.min(mazeHeight*cellSize-0.6, e.z));
            e.group.position.set(e.x, 1.0, e.z);
            e.group.rotation.y = e.facing;
            return e.isChasing;
        }

        function updateEnemies(dt) {
            let any = false;
            for (const e of enemies) if (updateOneEnemy(e, dt)) any = true;
            if (boss && !boss.dying) if (updateOneEnemy(boss, dt)) any = true;
            if (any) startChaseMusic(); else stopChaseMusic();
        }

        // -------------------- Death --------------------
        function updateDying(now) {
            const list = [...enemies];
            if (boss) list.push(boss);

            for (const e of list) {
                if (!e.dying) continue;
                const elapsed = (now - e.dieStart) / 1000;
                if (e.diePhase === 0) {
                    const t = Math.min(elapsed/0.5, 1);
                    const r = 1 - t;
                    e.sphereMat.color.setRGB(r,0,0);
                    e.sphereMat.emissive.setRGB(r*0.5,0,0);
                    if (t >= 1) { e.diePhase = 1; e.dieStart = now; }
                } else if (e.diePhase === 1) {
                    const t = Math.min(elapsed/0.1, 1);
                    const target = (wallHeight - 0.15) / e.radius;
                    e.group.scale.setScalar(1 + t*(target-1));
                    if (t >= 1) {
                        scene.remove(e.group);
                        if (e.isBoss) {
                            boss = null;
                            exitBossPhase();
                            hideBossLifeBar();
                            // Victory – no freeze, no fade to black
                            document.getElementById('levelCompleteText').textContent = 'You Beat The Game!';
                            document.getElementById('levelCompleteText').style.display = 'block';
                            levelComplete = true;
                            stopChaseMusic();
                            fanfareAudio.currentTime = 0;
                            fanfareAudio.play().catch(() => {});
                            // Restore control if we were mid note-game recovery
                            if (touchingEnemy === e) {
                                touchingEnemy = null;
                                gameFrozen = false;
                                document.getElementById('crosshair').style.display = 'block';
                                document.body.requestPointerLock();
                            }
                        } else {
                            enemies = enemies.filter(en => en !== e);
                            if (enemies.length === 0 && !bossSpawned) {
                                spawnBossArena();
                            } else {
                                fadeInTheme();
                            }
                            if (touchingEnemy === e) {
                                touchingEnemy = null;
                                gameFrozen = false;
                                stopChaseMusic();
                                document.getElementById('crosshair').style.display = 'block';
                                document.body.requestPointerLock();
                            }
                        }
                    }
                }
            }
        }

        // -------------------- Minimap --------------------
        function drawMinimap() {
            const canvas = document.getElementById('minimapCanvas');
            const ctx = canvas.getContext('2d');
            const w = canvas.width, cellPx = w / mazeWidth;
            ctx.fillStyle = 'rgba(20,20,40,0.9)';
            ctx.fillRect(0,0,w,w);
            ctx.fillStyle = '#2a3a5a';
            for (let x=0;x<mazeWidth;x++) for (let z=0;z<mazeHeight;z++)
                ctx.fillRect(x*cellPx+1, z*cellPx+1, cellPx-2, cellPx-2);

            ctx.strokeStyle = '#c0a0e0'; ctx.lineWidth = 2;
            for (let x=0;x<mazeWidth;x++) for (let z=0;z<mazeHeight;z++) {
                const c = maze[x][z];
                if (c.walls[0]){ctx.beginPath();ctx.moveTo(x*cellPx,z*cellPx);ctx.lineTo((x+1)*cellPx,z*cellPx);ctx.stroke();}
                if (c.walls[1]){ctx.beginPath();ctx.moveTo((x+1)*cellPx,z*cellPx);ctx.lineTo((x+1)*cellPx,(z+1)*cellPx);ctx.stroke();}
                if (c.walls[2]){ctx.beginPath();ctx.moveTo(x*cellPx,(z+1)*cellPx);ctx.lineTo((x+1)*cellPx,(z+1)*cellPx);ctx.stroke();}
                if (c.walls[3]){ctx.beginPath();ctx.moveTo(x*cellPx,z*cellPx);ctx.lineTo(x*cellPx,(z+1)*cellPx);ctx.stroke();}
            }

            ctx.fillStyle = '#ff3333';
            for (const e of enemies) {
                if (e.dying) continue;
                ctx.beginPath(); ctx.arc((e.x/cellSize)*cellPx, (e.z/cellSize)*cellPx, 4, 0, Math.PI*2); ctx.fill();
            }
            if (boss && !boss.dying) {
                ctx.fillStyle = '#ff0000';
                ctx.beginPath(); ctx.arc((boss.x/cellSize)*cellPx, (boss.z/cellSize)*cellPx, 7, 0, Math.PI*2); ctx.fill();
            }
            ctx.fillStyle = '#00ffff';
            ctx.beginPath(); ctx.arc((player.x/cellSize)*cellPx, (player.z/cellSize)*cellPx, 5, 0, Math.PI*2); ctx.fill();
        }

        // -------------------- Main loop --------------------
        let lastTime = performance.now();
        function animate(now) {
            requestAnimationFrame(animate);
            const dt = Math.min((now - lastTime)/1000, 0.05);
            lastTime = now;

            if (doorOpening && door) {
                const t = Math.min((now - doorOpenStartTime)/1000, 1);
                doorMaterial.opacity = 1 - t;
                doorPanelMaterials.forEach(m => m.opacity = 1 - t);
                if (t >= 1) {
                    doorOpening = false; doorOpen = true; door.visible = false; isHoveringDoor = false;
                }
            }

            if (!gameFrozen) {
                if (!doorOpen && !doorOpening && door) {
                    const h = isDoorUnderCrosshair();
                    if (h && !isHoveringDoor) {
                        doorMaterial.color.setHex(doorHoverColor);
                        playRedDoorBeep();
                        isHoveringDoor = true;
                    } else if (!h && isHoveringDoor) {
                        doorMaterial.color.setHex(doorNormalColor);
                        isHoveringDoor = false;
                    }
                }
            }

            // Movement stays available after victory (levelComplete does not freeze)
            if (!gameFrozen) {
                let nx = player.x, nz = player.z;
                const ang = camera.rotation.y;
                if (keys['w']||keys['arrowup'])    { nx -= Math.sin(ang)*player.speed; nz -= Math.cos(ang)*player.speed; }
                if (keys['s']||keys['arrowdown'])  { nx += Math.sin(ang)*player.speed; nz += Math.cos(ang)*player.speed; }
                if (keys['a']||keys['arrowleft'])  { nx -= Math.cos(ang)*player.speed; nz += Math.sin(ang)*player.speed; }
                if (keys['d']||keys['arrowright']) { nx += Math.cos(ang)*player.speed; nz -= Math.sin(ang)*player.speed; }

                if (!checkWallCollision(nx, player.z, player.radius)) player.x = nx;
                if (!checkWallCollision(player.x, nz, player.radius)) player.z = nz;

                const all = [...enemies];
                if (boss) all.push(boss);
                for (const e of all) {
                    if (e.dying) continue;
                    const dx = player.x - e.x, dz = player.z - e.z;
                    const dist = Math.sqrt(dx*dx + dz*dz);
                    if (dist < player.radius + e.radius) {
                        const push = (player.radius + e.radius - dist) / dist;
                        player.x += dx * push * 0.5;
                        player.z += dz * push * 0.5;
                    }
                }

                camera.position.set(player.x, 1.1, player.z);
                updateEnemies(dt);

                const hit = checkPlayerEnemyCollision();
                if (hit && !noteGame.active) {
                    touchingEnemy = hit;
                    stopChaseMusic();
                    if (hit.isBoss) {
                        // boss music keeps playing; just duck isn't needed
                    } else {
                        duckTheme();
                    }
                    playTouchChord();
                    startNoteGame(hit.isBoss ? 'boss' : 'enemy', hit);
                }
            }

            updateDying(now);
            drawMinimap();
            renderer.render(scene, camera);
        }

        // -------------------- Start --------------------
        document.getElementById('startButton').addEventListener('click', () => {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            document.getElementById('startScreen').style.display = 'none';
            document.getElementById('hud').style.display = 'block';
            document.getElementById('crosshair').style.display = 'block';
            document.getElementById('minimapCanvas').style.display = 'block';
            setLife(100);
            generateMaze();
            createMaze();
            spawnEnemies();
            themeAudio.currentTime = 0; themeAudio.volume = 0.5; themeAudio.play().catch(()=>{});
            lastTime = performance.now();
            animate(lastTime);
            document.body.requestPointerLock();
        });

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
